<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- TradingView Chart Type Dropdown SVG Icons Sprite -->

  <!-- Bars Icon -->
  <g id="icon-bars" viewBox="0 0 18 18">
    <path d="M6 3v12M6 8H3M12 3v12M12 11h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Candles Icon -->
  <g id="icon-candles" viewBox="0 0 18 18">
    <path d="M5.5 2v14M12.5 2v14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <rect x="3.5" y="5.5" width="4" height="7" rx="0.5" fill="currentColor" stroke="currentColor" stroke-width="1.6"/>
    <rect x="10.5" y="7" width="4" height="6" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  </g>

  <!-- Hollow Candles Icon -->
  <g id="icon-hollow-candles" viewBox="0 0 18 18">
    <path d="M5.5 2v14M12.5 2v14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <rect x="3.5" y="5.5" width="4" height="7" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <rect x="10.5" y="7" width="4" height="6" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  </g>

  <!-- Line Icon -->
  <g id="icon-line" viewBox="0 0 18 18">
    <path d="M2.5 13l4-5 4 4 5-8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Area Icon -->
  <g id="icon-area" viewBox="0 0 18 18">
    <path d="M2.5 12l4-4.5 4 3.5 5-7v11.5H2.5z" fill="currentColor" fill-opacity="0.15"/>
    <path d="M2.5 12l4-4.5 4 3.5 5-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Columns Icon -->
  <g id="icon-columns" viewBox="0 0 18 18">
    <rect x="3" y="8" width="3" height="7" rx="0.5" stroke="currentColor" stroke-width="1.6" fill="none"/>
    <rect x="7.5" y="4" width="3" height="11" rx="0.5" stroke="currentColor" stroke-width="1.6" fill="none"/>
    <rect x="12" y="10" width="3" height="5" rx="0.5" stroke="currentColor" stroke-width="1.6" fill="none"/>
  </g>

  <!-- Help / Question Circle Icon -->
  <g id="icon-help" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.4" fill="none"/>
    <path d="M6.5 6.5a1.5 1.5 0 0 1 2.8.6c0 .8-.8 1.1-1.3 1.5v.9M8 11.8h.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Favorite Star Icon -->
  <g id="icon-star" viewBox="0 0 16 16">
    <path d="M8 2l1.8 3.8 4.2.6-3 3 .7 4.1L8 11.5l-3.7 2 .7-4.1-3-3 4.2-.6z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="none"/>
  </g>
</svg>